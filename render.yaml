services:
  - type: web
    name: groq-chat
    runtime: python
    plan: free
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.7
        # Render defaults to the newest Python (3.14 as of this deploy), which is
        # too new for pydantic-core==2.27.2 to have a prebuilt wheel for -- it falls
        # back to compiling from source via Rust/maturin, which then fails separately
        # because Render's build filesystem is read-only for the Cargo cache.
        # Pinning to a stable, widely-supported version avoids both problems.
