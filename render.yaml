services:
  - type: web
    name: groq-chat
    runtime: python
    plan: free
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false # set this manually in the Render dashboard — never commit it
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: CORS_ORIGINS
        value: "*" # same-origin single service, so this isn't load-bearing here
